<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kyucode AI Game QA Agent</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0f1b2d;
      --panel2: #111827;
      --line: rgba(56,189,248,.30);
      --cyan: #22d3ee;
      --blue: #2563eb;
      --text: #e5eefb;
      --muted: #9db2d1;
      --red: #ef4444;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #10233f 0, #07111f 42%, #020817 100%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .nav {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      background: rgba(15, 27, 45, .96);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: white;
    }

    .logo span {
      color: var(--cyan);
    }

    .nav-info {
      display: flex;
      gap: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 48px 36px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 26px;
      margin-top: 34px;
      align-items: start;
    }

    .card {
      background: linear-gradient(180deg, rgba(15,27,45,.97), rgba(17,24,39,.97));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 44px rgba(0,0,0,.33);
      padding: 26px;
    }

    .upload-box {
      border: 2px dashed rgba(34,211,238,.55);
      border-radius: 18px;
      padding: 34px 24px;
      text-align: center;
      background: rgba(2,8,23,.35);
      cursor: pointer;
      display: block;
    }

    .upload-box:hover {
      border-color: var(--cyan);
      background: rgba(34,211,238,.08);
    }

    .upload-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .upload-desc {
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .file-list {
      margin-top: 18px;
      display: grid;
      gap: 8px;
    }

    .file-item {
      background: rgba(2,8,23,.48);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 900;
      cursor: pointer;
      transition: .2s;
      font-size: 15px;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .primary {
      flex: 1;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
    }

    .secondary {
      color: var(--text);
      background: rgba(148,163,184,.18);
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .status.info {
      display: block;
      background: rgba(34,211,238,.12);
      border: 1px solid rgba(34,211,238,.3);
    }

    .status.error {
      display: block;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.35);
      color: #fecaca;
    }

    .status.success {
      display: block;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.35);
      color: #bbf7d0;
    }

    .result-title {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .placeholder {
      min-height: 560px;
      border-radius: 18px;
      background: rgba(2,8,23,.42);
      border: 1px solid rgba(148,163,184,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      padding: 30px;
    }

    iframe {
      display: none;
      width: 100%;
      height: 780px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #020817;
    }

    .result-actions {
      display: none;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .result-actions a {
      color: white;
      text-decoration: none;
      background: rgba(34,211,238,.16);
      border: 1px solid rgba(34,211,238,.35);
      padding: 11px 14px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 1fr;
      }

      iframe {
        height: 640px;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">kyucode <span>AI Game QA Agent</span></div>
    <div class="nav-info">
      <span>Web UI</span>
      <span>Unity</span>
      <span>Vision Mode</span>
    </div>
  </nav>

  <main class="container">
    <h1>스크린샷 QA 분석</h1>
    <div class="subtitle">
      게임 스크린샷 1~10장을 업로드하면 kyucode가 Vision 분석, 정규화, QA Workbench 리포트 생성을 한 번에 실행합니다.
    </div>

    <section class="layout">
      <div class="card">
        <form id="uploadForm" enctype="multipart/form-data">
          <label class="upload-box" for="screenshots">
            <div class="upload-title">스크린샷 선택</div>
            <div class="upload-desc">
              PNG / JPG / JPEG 파일을 1~10장 업로드하세요.<br>
              Analyze 버튼을 누르면 기존 kyucode pipeline이 실행됩니다.
            </div>
          </label>

          <input id="screenshots" name="screenshots" type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg" multiple />

          <div id="fileList" class="file-list"></div>

          <div class="button-row">
            <button class="primary" id="analyzeButton" type="submit">Analyze</button>
            <button class="secondary" id="clearButton" type="button">Clear</button>
          </div>

          <div id="status" class="status"></div>
        </form>
      </div>

      <div class="card">
        <h2 class="result-title">분석 결과</h2>

        <div id="placeholder" class="placeholder">
          아직 분석 결과가 없습니다.<br>
          왼쪽에서 스크린샷을 업로드하고 Analyze 버튼을 눌러주세요.
        </div>

        <iframe id="reportFrame" title="kyucode QA Report"></iframe>

        <div id="resultActions" class="result-actions">
          <a href="/output/report_final.html" target="_blank">Open report in new tab</a>
          <a href="#" id="backButton">스크린샷 입력 화면으로 돌아가기</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("uploadForm");
    const input = document.getElementById("screenshots");
    const fileList = document.getElementById("fileList");
    const statusBox = document.getElementById("status");
    const analyzeButton = document.getElementById("analyzeButton");
    const clearButton = document.getElementById("clearButton");
    const iframe = document.getElementById("reportFrame");
    const placeholder = document.getElementById("placeholder");
    const resultActions = document.getElementById("resultActions");
    const backButton = document.getElementById("backButton");

    function setStatus(type, message) {
      statusBox.className = "status " + type;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = "status";
      statusBox.textContent = "";
    }

    function renderFileList() {
      const files = Array.from(input.files || []);
      fileList.innerHTML = "";

      files.forEach((file, index) => {
        const row = document.createElement("div");
        row.className = "file-item";
        row.innerHTML =
          "<span>" + (index + 1) + ". " + file.name + "</span>" +
          "<span>" + Math.round(file.size / 1024) + " KB</span>";
        fileList.appendChild(row);
      });
    }

    input.addEventListener("change", () => {
      clearStatus();
      renderFileList();

      const files = Array.from(input.files || []);
      if (files.length > 10) {
        setStatus("error", "최대 10장까지만 업로드할 수 있습니다.");
      }
    });

    clearButton.addEventListener("click", () => {
      input.value = "";
      fileList.innerHTML = "";
      clearStatus();
    });

    backButton.addEventListener("click", (event) => {
      event.preventDefault();
      iframe.style.display = "none";
      iframe.src = "";
      resultActions.style.display = "none";
      placeholder.style.display = "flex";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    async function parseResponse(response) {
      const text = await response.text();

      try {
        return JSON.parse(text);
      } catch (error) {
        if (text.trim().startsWith("/")) {
          return {
            ok: response.ok,
            message: "Analysis completed.",
            reportUrl: text.trim()
          };
        }

        throw new Error(text || "Server returned a non-JSON response.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const files = Array.from(input.files || []);

      if (files.length < 1) {
        setStatus("error", "최소 1장의 스크린샷을 선택해주세요.");
        return;
      }

      if (files.length > 10) {
        setStatus("error", "최대 10장까지만 업로드할 수 있습니다.");
        return;
      }

      const invalid = files.find(file => !["image/png", "image/jpeg"].includes(file.type));
      if (invalid) {
        setStatus("error", "PNG, JPG, JPEG 이미지만 업로드할 수 있습니다: " + invalid.name);
        return;
      }

      const formData = new FormData();
      files.forEach(file => formData.append("screenshots", file));

      analyzeButton.disabled = true;
      analyzeButton.textContent = "Analyzing...";
      setStatus("info", "분석 중입니다. Vision API 호출 때문에 시간이 걸릴 수 있습니다. 창을 닫지 마세요.");

      try {
        const response = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const data = await parseResponse(response);

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "Analysis failed.");
        }

        const reportUrl = data.reportUrl || "/output/report_final.html";

        setStatus("success", "분석 완료. 결과 리포트를 표시합니다.");
        placeholder.style.display = "none";
        iframe.style.display = "block";
        iframe.src = reportUrl + "?t=" + Date.now();
        resultActions.style.display = "flex";
      } catch (error) {
        setStatus("error", error.message);
      } finally {
        analyzeButton.disabled = false;
        analyzeButton.textContent = "Analyze";
      }
    });
  </script>
</body>
</html>
